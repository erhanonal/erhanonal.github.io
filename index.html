<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Talasius</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            text-align: center;
            border-top: 8px solid #e67e22;
        }
        h1 {
            color: #2c3e50;
            font-size: 48px;
            margin-top: 0;
            margin-bottom: 30px;
        }
        p {
            line-height: 1.6;
            margin-bottom: 15px;
        }
        p.first {
            color: #555;
            font-size: 22px;
            font-weight: bold;
        }
        p.second {
            color: #777;
            font-size: 18px;
        }
        p.third {
            color: #999;
            font-size: 16px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Talasius</h1>
        <p class="first">Basliyoruz</p>
        <p class="third">Hazir miyiz?</p>
        <p class="second">❤️❤️❤️❤️❤️❤️❤️❤️</p>
    </div>
</body>
</html>
